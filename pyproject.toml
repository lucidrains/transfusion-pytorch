[project]
name = "transfusion-pytorch"
version = "0.19.2"
description = "Transfusion in Pytorch"
authors = [
    { name = "Phil Wang", email = "lucidrains@gmail.com" }
]
readme = "README.md"
requires-python = ">= 3.8"
license = { file = "LICENSE" }
keywords = [
    'artificial intelligence',
    'deep learning',
    'transformers',
    'attention mechanism',
    'rectified flow',
  ]
classifiers=[
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3.8',
  ]

dependencies = [
    'axial-positional-embedding>=0.3.5',
    'beartype',
    'einx>=0.3.0',
    'einops>=0.8.0',
    'ema-pytorch',
    'jaxtyping',
    'loguru',
    'rotary_embedding_torch>=0.8.4',
    'torchdiffeq',
    'torch-einops-utils>=0.1.12',
    'torch>=2.0',
    'tqdm'
]

[project.urls]
Homepage = "https://pypi.org/project/transfusion-pytorch/"
Repository = "https://codeberg.org/lucidrains/transfusion-pytorch"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]

examples = [
    "adam-atan2-pytorch>=0.2.2",
    "datasets",
    "diffusers"
]
test = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["transfusion_pytorch"]

[tool.hatch.build.targets.sdist]
include = [
    "transfusion_pytorch",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
